<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>DB Browser 0.3</title>
<style>
:root{--bg:#080b12;--p:#111827;--line:#273244;--g:#6cffad;--m:#a6b1c2;--t:#eef5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#10251f,#080b12 48%);color:var(--t);font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:calc(14px + env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;background:#080b12ef;backdrop-filter:blur(16px);z-index:3;border-bottom:1px solid #202b3a}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.logo{font-size:21px;font-weight:800}.logo b{color:var(--g)}.tag{font-size:10px;color:var(--m);letter-spacing:1.4px}.search{display:flex;gap:8px}.search input{min-width:0;flex:1;background:var(--p);border:1px solid var(--line);color:white;border-radius:14px;padding:15px 12px;font-size:16px}button{color:var(--t);background:#141d2b;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer}.go{background:var(--g);color:#062516;border-color:var(--g);font-weight:800}nav{display:flex;gap:8px;overflow:auto;padding:12px 14px}nav button.active,.tab.current{border-color:var(--g);color:var(--g)}main{padding:2px 14px 30px;max-width:850px;margin:auto}.view{display:none}.view.active{display:block}.hero{padding:20px 3px 12px}.hero h1{font-size:26px;margin:0 0 8px}.hero p,.hint{color:var(--m);font-size:13px;line-height:1.5}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:17px 0 10px}.sectionhead h2{font-size:16px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.shortcut{text-align:left;white-space:normal;background:linear-gradient(135deg,#131f2e,#0e1420);padding:14px}.emoji{font-size:24px;display:block;margin-bottom:9px}.shortcut strong,.shortcut small{display:block}.shortcut small,.url{color:var(--m);font-size:12px;margin-top:4px;overflow-wrap:anywhere}.card{background:#101725;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px;overflow-wrap:anywhere}.itemtop{display:flex;gap:10px}.itemmain{flex:1;min-width:0}.itemmain strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:12px;padding:8px 10px}.empty{color:var(--m);padding:22px 12px;text-align:center;border:1px dashed #344052;border-radius:15px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.tab{min-width:120px;max-width:180px;display:flex;gap:7px;align-items:center}.tabname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.pill{font-size:11px;border:1px solid #344052;border-radius:99px;padding:4px 8px;color:var(--m)}.framebox{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:white}.framebar{background:#101725;padding:10px;display:flex;gap:8px;align-items:center}.framebar span{font-size:12px;color:var(--m);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}iframe{display:block;width:100%;height:45vh;border:0;background:white}.footer{text-align:center;color:#64748b;font-size:11px;padding:20px 0}
</style></head><body>
<header><div class="brand"><div><div class="logo">DB <b>Browser</b></div><div class="tag">DARK MODE • WEB PROTOTYPE</div></div><span class="pill" id="count">1 tab</span></div><form class="search" id="form"><input id="address" placeholder="Nhập địa chỉ hoặc tìm kiếm..." autocomplete="url"><button class="go">ĐI ↗</button></form></header>
<nav><button class="active" data-view="home">⌂ Trang chủ</button><button data-view="tabs">▣ Tab</button><button data-view="bookmarks">☆ Dấu trang</button><button data-view="history">◷ Lịch sử</button></nav>
<main>
<section class="view active" id="home"><div class="hero"><h1>Chào mừng đến DB Browser</h1><p>Nhập địa chỉ hoặc từ khóa ở phía trên để bắt đầu.</p></div><div class="sectionhead"><h2>Truy cập nhanh</h2><button id="addShortcut">＋ Thêm lối tắt</button></div><div class="grid"><button class="shortcut" data-url="https://www.google.com"><span class="emoji">🔎</span><strong>Google</strong><small>Tìm kiếm web</small></button><button class="shortcut" data-url="https://www.youtube.com"><span class="emoji">▶️</span><strong>YouTube</strong><small>Video</small></button><button class="shortcut" data-url="https://www.wikipedia.org"><span class="emoji">📚</span><strong>Wikipedia</strong><small>Bách khoa</small></button><button class="shortcut" data-url="https://www.bing.com"><span class="emoji">🌐</span><strong>Bing</strong><small>Tìm kiếm</small></button></div><div class="sectionhead"><h2>Tab hiện tại</h2><button id="newHome">＋ Tab mới</button></div><div id="currentCard" class="card"></div></section>
<section class="view" id="tabs"><div class="sectionhead"><h2>Quản lý tab</h2><button id="newTab">＋ Tab mới</button></div><div id="tabStrip" class="tabs"></div><div id="tabDetail"></div></section>
<section class="view" id="bookmarks"><div class="sectionhead"><h2>Dấu trang đã lưu</h2><button id="saveCurrent">☆ Lưu trang hiện tại</button></div><div id="bookmarkList"></div></section>
<section class="view" id="history"><div class="sectionhead"><h2>Lịch sử duyệt web</h2><button id="clearHistory">Xóa lịch sử</button></div><div id="historyList"></div></section>
<div class="footer">DB Browser 0.3 • Bản web thử nghiệm • Dữ liệu lưu trên thiết bị này</div></main>
<script>
const $=id=>document.getElementById(id), read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let bookmarks=read('dbb3_bookmarks',[]), history=read('dbb3_history',[]), tabs=read('dbb3_tabs',null);if(!Array.isArray(tabs)||!tabs.length)tabs=[{id:1,url:'',title:'Tab mới',back:[],forward:[]}];let active=tabs[0].id;
const cur=()=>tabs.find(t=>t.id===active)||tabs[0], save=()=>localStorage.setItem('dbb3_bookmarks',JSON.stringify(bookmarks))||localStorage.setItem('dbb3_history',JSON.stringify(history))||localStorage.setItem('dbb3_tabs',JSON.stringify(tabs));
function normalize(s){s=s.trim();if(!s)return '';if(/\s/.test(s)||!s.includes('.'))return 'https://www.google.com/search?q='+encodeURIComponent(s);return /^https?:\/\//i.test(s)?s:'https://'+s}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u||'Tab mới'}}
function record(u){history.unshift({url:u,title:host(u),time:Date.now()});history=history.filter((x,i,a)=>a.findIndex(y=>y.url===x.url)===i).slice(0,150);save()}
function go(s){let u=normalize(s);if(!u)return;let t=cur();if(t.url&&t.url!==u){t.back.push(t.url);t.forward=[]}t.url=u;t.title=host(u);record(u);render()}
function newTab(u=''){let t={id:Date.now(),url:u,title:host(u),back:[],forward:[]};tabs.push(t);active=t.id;if(u)record(u);save();render()}
function switchTab(id){active=id;render()}
function closeTab(id){if(tabs.length===1){tabs=[{id:Date.now(),url:'',title:'Tab mới',back:[],forward:[]}];active=tabs[0].id}else{tabs=tabs.filter(t=>t.id!==id);if(active===id)active=tabs[tabs.length-1].id}save();render()}
function saved(u){return bookmarks.some(x=>x.url===u)}
function toggleBookmark(u=cur().url){if(!u){alert('Mở trang trước nhé!');return}bookmarks=saved(u)?bookmarks.filter(x=>x.url!==u):[{url:u,title:host(u),time:Date.now()},...bookmarks];save();render()}
function view(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}
function card(x,type){return `<div class="card"><div class="itemtop"><div class="itemmain"><strong>${esc(x.title||host(x.url))}</strong><div class="url">${esc(x.url)}</div><div class="url">${type==='history'?new Date(x.time).toLocaleString():''}</div></div></div><div class="actions"><button data-act="open" data-url="${esc(x.url)}">Mở tab này</button><button data-act="new" data-url="${esc(x.url)}">Mở tab mới</button><button data-act="remove" data-url="${esc(x.url)}" data-type="${type}">${type==='bookmark'?'Bỏ lưu':'Xóa mục'}</button></div></div>`}
function render(){let t=cur();$('address').value=t.url;$('count').textContent=tabs.length+' tab';$('currentCard').innerHTML=`<strong>${esc(t.title||'Tab mới')}</strong><div class="url">${esc(t.url||'Chưa mở trang')}</div><div class="actions">${t.url?'<button id="outsideHome">Mở ngoài ↗</button>':''}<button id="bookmarkHome">${saved(t.url)?'★ Đã lưu':'☆ Lưu dấu trang'}</button></div>`;$('tabStrip').innerHTML=tabs.map(x=>`<button class="tab ${x.id===active?'current':''}" data-act="switch" data-id="${x.id}"><span class="tabname">${esc(x.title)}</span><span data-act="close" data-id="${x.id}">×</span></button>`).join('');$('tabDetail').innerHTML=`<div class="card"><strong>${esc(t.title)}</strong><div class="url">${esc(t.url||'Chưa mở trang')}</div><div class="actions"><button id="outsideTab" ${t.url?'':'disabled'}>Mở ngoài ↗</button><button id="bookmarkTab" ${t.url?'':'disabled'}>${saved(t.url)?'★ Đã lưu':'☆ Lưu dấu trang'}</button><button id="closeCurrent">Đóng tab ×</button></div></div>${t.url?`<div class="framebox"><div class="framebar"><span>${esc(t.url)}</span><button id="outsideFrame">Mở ngoài ↗</button></div><iframe title="Trang web" src="${esc(t.url)}" sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe></div><p class="hint">Một số website chặn hiển thị trong khung. Dùng “Mở ngoài” để xem đầy đủ bằng Safari.</p>`:''}`;$('bookmarkList').innerHTML=bookmarks.length?bookmarks.map(x=>card(x,'bookmark')).join(''):'<div class="empty">Chưa có dấu trang. Mở một trang rồi bấm Lưu trang hiện tại.</div>';$('historyList').innerHTML=history.length?history.map(x=>card(x,'history')).join(''):'<div class="empty">Lịch sử đang trống.</div>'}
$('form').addEventListener('submit',e=>{e.preventDefault();go($('address').value)});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.addEventListener('click',e=>{let a=e.target.closest('[data-act]');if(a){let act=a.dataset.act,id=Number(a.dataset.id),u=a.dataset.url;if(act==='switch')switchTab(id);if(act==='close')closeTab(id);if(act==='open'){go(u);view('tabs')}if(act==='new'){newTab(u);view('tabs')}if(act==='remove'){if(a.dataset.type==='bookmark')bookmarks=bookmarks.filter(x=>x.url!==u);else history=history.filter(x=>x.url!==u);save();render()}return}let s=e.target.closest('[data-url]');if(s&&s.classList.contains('shortcut'))go(s.dataset.url);if(['outsideHome','outsideTab','outsideFrame'].includes(e.target.id)&&cur().url)window.open(cur().url,'_blank','noopener');if(['bookmarkHome','bookmarkTab'].includes(e.target.id))toggleBookmark();if(e.target.id==='closeCurrent')closeTab(active)});
$('newTab').onclick=()=>newTab();$('newHome').onclick=()=>{newTab();view('home')};$('saveCurrent').onclick=()=>toggleBookmark();$('addShortcut').onclick=()=>{let u=prompt('Nhập địa chỉ website');if(u)go(u)};$('clearHistory').onclick=()=>{if(confirm('Xóa toàn bộ lịch sử?')){history=[];save();render()}};
render();
</script></body></html>
